name: parity-gate

on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18.17.0 is the engines floor (fs.readdirSync recursive); keep it pinned, not 18.x.
        node-version: ['18.17.0', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Drift check: the committed tree must already match the catalog.
      - run: node bin/bake-prices.mjs --check
      # Offline trust anchor: visible == JSON-LD == snapshot, no network.
      - run: node --test
      # No dependencies; package-lock.json exists so this can run at all.
      - run: npm audit --omit=dev
